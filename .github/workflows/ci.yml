name: CI

on: [push]

jobs:
  pr04:
    runs-on: ubuntu-24.04
    container: osrf/ros:jazzy-desktop-full
    defaults:
      run:
        shell: bash
    env:
      KIT: robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
      KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # checker сравнивает коммиты, нужна вся история

      - name: Download course kit
        run: |
          curl -fsSLO "https://ros.lms.ci.nsu.ru/downloads/$KIT"
          echo "$KIT_SHA256  $KIT" | sha256sum -c
          mkdir -p .course-kit
          tar -xzf "$KIT" -C .course-kit

      - name: Build packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select turtle_bringup patrol
          test -f install/turtle_bringup/share/turtle_bringup/launch/sim.launch.py

      - name: Test patrol
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test

      - name: Check evidence
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .course-kit/v1/tools/check_practice.py PR04 --submission .
