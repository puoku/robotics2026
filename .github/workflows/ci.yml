name: CI

on: [push]

jobs:
  pr06:
    runs-on: ubuntu-24.04
    container: osrf/ros:jazzy-desktop-full
    defaults:
      run:
        shell: bash
    env:
      KIT: robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
      KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # checker сравнивает коммиты, нужна вся история

      - name: Download course kit
        run: |
          curl -fsSLO "https://ros.lms.ci.nsu.ru/downloads/$KIT"
          echo "$KIT_SHA256  $KIT" | sha256sum -c
          mkdir -p .course-kit
          tar -xzf "$KIT" -C .course-kit

      - name: Build packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select turtle_bringup patrol course_bringup course_description
          test -f install/course_bringup/share/course_bringup/launch/patrol.launch.py
          test -f install/course_description/share/course_description/urdf/vehicle.urdf.xacro
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf

      - name: Test packages
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select patrol course_bringup course_description
          colcon test-result --verbose

      - name: Check evidence
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
