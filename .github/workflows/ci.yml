name: CI

on: [push]

jobs:
  pr02:
    runs-on: ubuntu-24.04
    container: osrf/ros:jazzy-desktop-full
    defaults:
      run:
        shell: bash
    env:
      KIT: robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # checker сравнивает коммиты, нужна вся история

      - name: Download course kit
        run: |
          curl -fsSLO "https://ros.lms.ci.nsu.ru/downloads/$KIT"
          echo "$KIT_SHA256  $KIT" | sha256sum -c
          mkdir -p .course-kit
          tar -xzf "$KIT" -C .course-kit

      - name: Build turtle_bringup
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select turtle_bringup
          test -f install/turtle_bringup/share/turtle_bringup/launch/sim.launch.py

      - name: Check launch file
        run: python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Check evidence
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .course-kit/v1/tools/check_practice.py PR02 --submission .
